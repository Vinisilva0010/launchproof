# Calls the API health endpoint every 10 minutes so the free Render instance does not sleep.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API
        run: curl -fsS --retry 5 --retry-delay 20 --max-time 90 "LP_API_URL_PLACEHOLDER/health"

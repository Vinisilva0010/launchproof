[package]
name = "launchproof"
version = "0.1.0"
description = "Verifies LaunchProof attestations and enforces buyer risk limits inside the purchase transaction"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "launchproof"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
lp-attest = { path = "../../crates/lp-attest", default-features = false }
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

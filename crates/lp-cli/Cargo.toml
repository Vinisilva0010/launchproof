[package]
name = "lp-cli"
version = "0.1.0"
description = "LaunchProof devnet CLI: program configuration, demo Pump.fun launches and guarded purchases"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anchor-lang = "1.2.0"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
launchproof = { path = "../../programs/launchproof", features = ["no-entrypoint"] }
lp-attest = { path = "../lp-attest" }
lp-investigate = { path = "../lp-investigate" }
lp-tx = { path = "../lp-tx" }
serde_json = "1"
solana-commitment-config = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-rpc-client = "3"
solana-rpc-client-api = "3"
solana-sdk-ids = "3"
solana-signer = "3"
solana-transaction = "3"

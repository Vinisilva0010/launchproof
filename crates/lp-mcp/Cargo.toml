[package]
name = "lp-mcp"
version = "0.1.0"
description = "LaunchProof MCP server: lets AI agents investigate Pump.fun launches and buy through the on-chain guard"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
solana-commitment-config = "3"
solana-keypair = "3"
solana-rpc-client = "3"
solana-rpc-client-api = "3"
solana-signer = "3"
solana-transaction = "3"
